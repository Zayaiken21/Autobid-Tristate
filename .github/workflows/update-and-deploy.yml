name: Update auction data

# nyc.gov currently refuses requests from GitHub's servers (HTTP 403), so this only runs when
# started by hand (Actions tab -> Run workflow). The reliable ways to update data are
# update_data.bat on your PC, or "Import auction PDF" in the app.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pypdf

      - name: Fetch NYC Marshal / Sheriff auction lists
        run: python scripts/fetch_nyc_auctions.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name "autobid-bot"
          git config user.email "autobid-bot@users.noreply.github.com"
          mkdir -p data
          git add -A data/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update NYC auction data [skip ci]"
            git push
          fi
